<!DOCTYPE html>
<html lang="tr" data-theme="light">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
<meta name="theme-color" content="#1f5137" />
<meta name="description" content="Zaman çizgisi üzerinden İngilizce zamanlarını öğreten, Türk kültüründen örneklerle hazırlanmış ücretsiz uygulama." />
<title>Kolay İngilizce — Zamanlarla Öğren</title>
<link rel="icon" href="assets/favicon.svg" type="image/svg+xml" />
<link rel="manifest" href="manifest.webmanifest" />
<link rel="stylesheet" href="css/base.css" />
<link rel="stylesheet" href="css/components.css" />
<link rel="stylesheet" href="css/layout.css" />
</head>
<body>

<a class="skip-link" href="#view">İçeriğe geç</a>

<header class="appbar">
  <div class="appbar__inner">
    <a class="brand" href="#/harita" data-sfx="tap">
      <span class="brand__mark" aria-hidden="true">
        <svg viewBox="0 0 48 48" width="34" height="34">
          <circle cx="24" cy="24" r="22" fill="var(--green-700)"/>
          <path d="M6 24h36" stroke="var(--cream)" stroke-width="2.5" stroke-linecap="round"/>
          <circle cx="14" cy="24" r="3.6" fill="var(--mustard)"/>
          <circle cx="24" cy="24" r="4.6" fill="var(--cream)"/>
          <circle cx="34" cy="24" r="3.6" fill="var(--sky, #7bb08a)"/>
          <path d="M24 12v4M24 32v4" stroke="var(--cream)" stroke-width="2" stroke-linecap="round"/>
        </svg>
      </span>
      <span class="brand__text">
        <strong>Kolay İngilizce</strong>
        <small>Zamanlarla Öğren</small>
      </span>
    </a>

    <div class="appbar__actions">
      <button class="iconbtn" id="btn-sound" type="button" title="Ses efektleri" aria-label="Ses efektlerini aç/kapat">
        <span class="iconbtn__glyph" data-on="🔔" data-off="🔕">🔔</span>
      </button>
      <button class="iconbtn" id="btn-theme" type="button" title="Tema" aria-label="Açık/koyu tema">
        <span class="iconbtn__glyph">🌙</span>
      </button>
      <button class="iconbtn" id="btn-settings" type="button" title="Ayarlar" aria-label="Ayarlar">
        <span class="iconbtn__glyph">⚙︎</span>
      </button>
    </div>
  </div>

  <nav class="tabbar" id="tabbar" aria-label="Ana menü">
    <a class="tab" href="#/harita" data-route="harita"><span class="tab__ico">🗺️</span><span class="tab__txt">Harita</span></a>
    <a class="tab" href="#/temeller" data-route="temeller"><span class="tab__ico">🧱</span><span class="tab__txt">Temeller</span></a>
    <a class="tab" href="#/alistirma" data-route="alistirma"><span class="tab__ico">🎯</span><span class="tab__txt">Alıştırma</span></a>
    <a class="tab" href="#/sozluk" data-route="sozluk"><span class="tab__ico">📖</span><span class="tab__txt">Sözlük</span></a>
  </nav>
</header>

<main id="view" class="view" tabindex="-1"></main>

<footer class="sitefoot">
  <p>Kolay İngilizce · Zaman çizgisiyle gramer · <span id="foot-count"></span></p>
  <p class="sitefoot__mini">Örnekler Türk ve Osmanlı kültüründen seçilmiştir. Sesler cihazınızın kendi konuşma motoruyla üretilir.</p>
</footer>

<!-- Kelime baloncuğu -->
<div class="sheet" id="word-sheet" hidden role="dialog" aria-modal="false" aria-label="Kelime anlamı">
  <div class="sheet__card">
    <button class="sheet__close" id="word-close" type="button" aria-label="Kapat">✕</button>
    <div class="sheet__head">
      <h3 class="sheet__word" id="word-title">—</h3>
      <button class="btn btn--icon" id="word-speak" type="button" title="Oku">🔊</button>
    </div>
    <p class="sheet__pos" id="word-pos"></p>
    <p class="sheet__mean" id="word-mean"></p>
    <p class="sheet__note" id="word-note"></p>
    <div class="sheet__foot">
      <button class="btn btn--ghost" id="word-save" type="button">⭐ Kelime defterime ekle</button>
    </div>
  </div>
</div>

<!-- Ayarlar -->
<div class="modal" id="settings-modal" hidden role="dialog" aria-modal="true" aria-label="Ayarlar">
  <div class="modal__card">
    <div class="modal__head">
      <h2>Ayarlar</h2>
      <button class="iconbtn" id="settings-close" type="button" aria-label="Kapat">✕</button>
    </div>
    <div class="modal__body" id="settings-body"></div>
  </div>
</div>

<div class="toast" id="toast" hidden></div>

<!-- Çekirdek -->
<script src="js/core/utils.js"></script>
<script src="js/core/store.js"></script>
<script src="js/core/audio.js"></script>
<script src="js/core/speech.js"></script>
<!-- Veri -->
<script src="js/data/glossary.js"></script>
<script src="js/data/vocabulary.js"></script>
<script src="js/data/tenses.js"></script>
<script src="js/data/basics.js"></script>
<script src="js/data/exercises.js"></script>
<!-- Arayüz -->
<script src="js/ui/timeline.js"></script>
<script src="js/ui/sentence.js"></script>
<script src="js/ui/home.js"></script>
<script src="js/ui/tense.js"></script>
<script src="js/ui/practice.js"></script>
<script src="js/ui/basics.js"></script>
<script src="js/ui/dictionary.js"></script>
<script src="js/ui/settings.js"></script>
<script src="js/app.js"></script>
</body>
</html>
