<!DOCTYPE html>
<html lang="tr" data-theme="light">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
<meta name="theme-color" content="#1f5137" />
<meta name="description" content="Zaman çizgisi üzerinden İngilizce zamanlarını öğreten, Türk kültüründen örneklerle hazırlanmış ücretsiz uygulama." />
<title>Gramer Atlası — Zamanlarla Öğren</title>
<link rel="icon" href="assets/favicon.svg" type="image/svg+xml" />
<link rel="manifest" href="manifest.webmanifest" />
<link rel="stylesheet" href="css/base.css" />
<link rel="stylesheet" href="css/components.css" />
<link rel="stylesheet" href="css/layout.css" />
<link rel="stylesheet" href="css/game.css" />
<link rel="stylesheet" href="css/stats.css" />
</head>
<body>

<a class="skip-link" href="#view">İçeriğe geç</a>

<header class="appbar" id="appbar">
  <div class="appbar__inner">
    <a class="brand" href="#/" data-sfx="tap">
      <span class="brand__mark" aria-hidden="true">
        <img class="brand__logo" src="assets/logo.svg" alt="" width="34" height="34" />
      </span>
      <span class="brand__text">
        <strong>Gramer Atlası</strong>
      </span>
    </a>

    <div class="appbar__actions">
      <button class="iconbtn" id="btn-hearts" type="button" title="Canlar" aria-label="Canlar" hidden>
        <span class="iconbtn__glyph" data-icon="ach-heart"></span>
        <span class="iconbtn__badge" id="hearts-badge">7</span>
      </button>
      <button class="iconbtn" id="btn-achievements" type="button" title="Başarımlar" aria-label="Başarımlar">
        <span class="iconbtn__glyph" data-icon="trophy"></span>
        <span class="iconbtn__badge" id="ach-badge" hidden>0</span>
      </button>
      <button class="iconbtn" id="btn-settings" type="button" title="Ayarlar" aria-label="Ayarlar">
        <span class="iconbtn__glyph" data-icon="sliders"></span>
      </button>
    </div>
  </div>

  <nav class="tabbar" id="tabbar" aria-label="Ana menü">
    <a class="tab" href="#/harita" data-route="harita"><span class="tab__ico" data-icon="map"></span><span class="tab__txt">Harita</span></a>
    <a class="tab" href="#/temeller" data-route="temeller"><span class="tab__ico" data-icon="wall"></span><span class="tab__txt">Temeller</span></a>
    <a class="tab" href="#/alistirma" data-route="alistirma"><span class="tab__ico" data-icon="target"></span><span class="tab__txt">Alıştırma</span></a>
    <a class="tab" href="#/sozluk" data-route="sozluk"><span class="tab__ico" data-icon="book"></span><span class="tab__txt">Sözlük</span></a>
  </nav>
</header>

<main id="view" class="view" tabindex="-1"></main>

<!-- Kelime baloncuğu -->
<div class="sheet" id="word-sheet" hidden role="dialog" aria-modal="false" aria-label="Kelime anlamı">
  <div class="sheet__card">
    <button class="sheet__close" id="word-close" type="button" aria-label="Kapat" data-icon="close"></button>
    <div class="sheet__head">
      <h3 class="sheet__word" id="word-title">—</h3>
      <button class="btn btn--icon" id="word-speak" type="button" title="Oku" data-icon="speaker"></button>
    </div>
    <p class="sheet__pos" id="word-pos"></p>
    <p class="sheet__mean" id="word-mean"></p>
    <p class="sheet__note" id="word-note"></p>
    <div class="sheet__ex" id="word-ex" hidden>
      <span class="sheet__ex-lbl">Uygulamadan bir örnek</span>
      <p class="sheet__ex-en" id="word-ex-en"></p>
      <p class="sheet__ex-tr" id="word-ex-tr"></p>
    </div>
    <div class="sheet__foot">
      <button class="btn btn--ghost" id="word-save" type="button"></button>
    </div>
  </div>
</div>

<!-- Ayarlar -->
<div class="modal" id="settings-modal" hidden role="dialog" aria-modal="true" aria-label="Ayarlar">
  <div class="modal__card">
    <div class="modal__head">
      <h2>Ayarlar</h2>
      <button class="iconbtn" id="settings-close" type="button" aria-label="Kapat" data-icon="close"></button>
    </div>
    <div class="modal__body" id="settings-body"></div>
  </div>
</div>

<!-- Başarımlar -->
<div class="modal" id="achievements-modal" hidden role="dialog" aria-modal="true" aria-label="Başarımlar">
  <div class="modal__card">
    <div class="modal__head">
      <h2>Başarımlar</h2>
      <button class="iconbtn" id="achievements-close" type="button" aria-label="Kapat" data-icon="close"></button>
    </div>
    <div class="modal__body" id="achievements-body"></div>
  </div>
</div>

<!-- Başarım kazanıldı kutlaması -->
<div class="modal" id="ach-earned-modal" hidden role="dialog" aria-modal="true" aria-label="Başarım kazanıldı">
  <div class="modal__card ach-pop" id="ach-earned-card"></div>
</div>

<!-- Oyun Modu: canlar -->
<div class="modal" id="hearts-modal" hidden role="dialog" aria-modal="true" aria-label="Canlar">
  <div class="modal__card">
    <div class="modal__head">
      <h2>Canlar</h2>
      <button class="iconbtn" id="hearts-close" type="button" aria-label="Kapat" data-icon="close"></button>
    </div>
    <div class="modal__body" id="hearts-body"></div>
  </div>
</div>

<!-- Tüm ilerlemeyi sıfırlama onayı -->
<div class="modal" id="reset-confirm-modal" hidden role="dialog" aria-modal="true" aria-label="Sıfırlamayı onayla">
  <div class="modal__card" id="reset-confirm-card"></div>
</div>

<div class="toast" id="toast" hidden role="status" aria-live="polite"></div>

<!-- Çekirdek -->
<script src="js/core/utils.js" defer></script>

<!-- Veri -->
<script src="js/data/glossary.js" defer></script>

<script src="js/data/vocabulary-b2.js" defer></script>
<script src="js/data/vocabulary-b2-plus.js" defer></script>

<script src="js/data/examples-extra-7.js" defer></script>

<script src="js/data/basics.js" defer></script>
<script src="js/data/stories.js" defer></script>
<script src="js/data/timeline-journey.js" defer></script>
<script src="js/data/exercises.js" defer></script>

<!-- Arayüz -->

<script src="js/ui/gate.js" defer></script>
<script src="js/ui/game.js" defer></script>
<script src="js/app.js" defer></script>
</body>
</html>
