<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" role="img" aria-labelledby="t1 d1">
  <title id="t1">Eğitim Modu simgesi</title>
  <desc id="d1">Sallanan püskülü ve parıldayan yıldızı olan animasyonlu bir mezuniyet kepi.</desc>
  <defs>
    <linearGradient id="capg" x1="42" y1="64" x2="158" y2="112" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#f1bd5a"/>
      <stop offset="1" stop-color="#d8a244"/>
    </linearGradient>
    <style>
      .cap { transform-origin: 100px 95px; animation: cap-settle 3.6s ease-in-out infinite; }
      .tassel { transform-origin: 100px 88px; animation: tassel-swing 3.6s ease-in-out infinite; }
      .sparkle { transform-origin: 152px 52px; animation: sparkle-pulse 3.6s ease-in-out infinite; }
      @keyframes cap-settle {
        0%, 100% { transform: translateY(0) rotate(0deg); }
        45% { transform: translateY(-5px) rotate(-1.2deg); }
        72% { transform: translateY(1px) rotate(.4deg); }
      }
      @keyframes tassel-swing {
        0%, 100% { transform: rotate(0deg); }
        45% { transform: rotate(11deg); }
        72% { transform: rotate(-4deg); }
      }
      @keyframes sparkle-pulse {
        0%, 30% { opacity: 0; transform: scale(.4); }
        45% { opacity: 1; transform: scale(1); }
        65%, 100% { opacity: 0; transform: scale(.4); }
      }
      @media (prefers-reduced-motion: reduce) {
        .cap, .tassel, .sparkle { animation: none; }
      }
    </style>
  </defs>

  <g class="cap">
    <ellipse cx="100" cy="120" rx="44" ry="17" fill="#fbf6e9" stroke="#111827" stroke-width="5"/>
    <g class="tassel">
      <path d="M100 88c10 6 18 20 18 40" fill="none" stroke="#111827" stroke-width="4" stroke-linecap="round"/>
      <circle cx="118.5" cy="129" r="7.5" fill="url(#capg)" stroke="#111827" stroke-width="4"/>
    </g>
    <polygon points="100,60 160,88 100,116 40,88" fill="url(#capg)" stroke="#111827" stroke-width="5" stroke-linejoin="round"/>
    <circle cx="100" cy="88" r="6" fill="#111827"/>
  </g>

  <g class="sparkle">
    <path d="M152 40v9M152 55v9M140 52h9M155 52h9" stroke="#5aa077" stroke-width="4" stroke-linecap="round"/>
  </g>
</svg>
