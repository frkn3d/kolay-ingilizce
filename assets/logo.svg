<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" role="img" aria-labelledby="title desc">
  <title id="title">English learning app icon</title>
  <desc id="desc">A transparent square SVG icon with an open book and a simple left-right arrow inside the pages.</desc>

  <defs>
    <linearGradient id="page" x1="126" y1="132" x2="386" y2="414" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#fff7e6"/>
      <stop offset="1" stop-color="#e9d7aa"/>
    </linearGradient>
    <linearGradient id="accent" x1="153" y1="282" x2="359" y2="282" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#d8a244"/>
      <stop offset=".5" stop-color="#f1bd5a"/>
      <stop offset="1" stop-color="#d8a244"/>
    </linearGradient>
    <filter id="softShadow" x="-20%" y="-20%" width="140%" height="150%">
      <feDropShadow dx="0" dy="16" stdDeviation="13" flood-color="#111827" flood-opacity=".18"/>
    </filter>
    <style>
      .logo {
        transform-origin: 256px 286px;
        animation: logo-settle 4.8s ease-in-out infinite;
      }
      .page-left {
        transform-origin: 256px 300px;
        animation: page-left 4.8s ease-in-out infinite;
      }
      .page-right {
        transform-origin: 256px 300px;
        animation: page-right 4.8s ease-in-out infinite;
      }
      .arrow-core,
      .arrow-glow {
        transform-origin: 256px 270px;
        animation: arrow-breathe 4.8s ease-in-out infinite;
      }
      .arrow-left {
        transform-origin: 122px 270px;
        animation: arrow-left 4.8s ease-in-out infinite;
      }
      .arrow-right {
        transform-origin: 390px 270px;
        animation: arrow-right 4.8s ease-in-out infinite;
      }

      @keyframes logo-settle {
        0%, 100% { transform: translateY(0); }
        42% { transform: translateY(-4px); }
        70% { transform: translateY(1px); }
      }
      @keyframes page-left {
        0%, 100% { transform: rotate(0deg) translateX(0); }
        42% { transform: rotate(-1.9deg) translateX(-5px); }
        70% { transform: rotate(.4deg) translateX(1px); }
      }
      @keyframes page-right {
        0%, 100% { transform: rotate(0deg) translateX(0); }
        42% { transform: rotate(1.9deg) translateX(5px); }
        70% { transform: rotate(-.4deg) translateX(-1px); }
      }
      @keyframes arrow-breathe {
        0%, 100% { transform: scaleX(.94); opacity: .92; }
        42% { transform: scaleX(1.04); opacity: 1; }
        70% { transform: scaleX(.98); opacity: .96; }
      }
      @keyframes arrow-left {
        0%, 100% { transform: translateX(0); }
        42% { transform: translateX(-8px); }
        70% { transform: translateX(2px); }
      }
      @keyframes arrow-right {
        0%, 100% { transform: translateX(0); }
        42% { transform: translateX(8px); }
        70% { transform: translateX(-2px); }
      }

      @media (prefers-reduced-motion: reduce) {
        .logo,
        .page-left,
        .page-right,
        .arrow-core,
        .arrow-glow,
        .arrow-left,
        .arrow-right {
          animation: none;
        }
      }
    </style>
  </defs>

  <g class="logo" filter="url(#softShadow)">
    <path class="page-left" d="M76 152c72-31 133-17 180 37v230c-51-45-111-56-180-28Z" fill="url(#page)" stroke="#111827" stroke-width="18" stroke-linejoin="round"/>
    <path class="page-right" d="M256 189c47-54 108-68 180-37v239c-69-28-129-17-180 28Z" fill="url(#page)" stroke="#111827" stroke-width="18" stroke-linejoin="round"/>
    <path d="M256 189v230" fill="none" stroke="#111827" stroke-width="14" stroke-linecap="round"/>

    <path class="arrow-glow" d="M169 270h174" fill="none" stroke="url(#accent)" stroke-width="20" stroke-linecap="round"/>
    <path class="arrow-left" d="M122 270l38-38M122 270l38 38" fill="none" stroke="#111827" stroke-width="15" stroke-linecap="round" stroke-linejoin="round"/>
    <path class="arrow-right" d="M390 270l-38-38M390 270l-38 38" fill="none" stroke="#111827" stroke-width="15" stroke-linecap="round" stroke-linejoin="round"/>
    <path class="arrow-core" d="M172 270h168" fill="none" stroke="url(#accent)" stroke-width="10" stroke-linecap="round"/>
  </g>
</svg>
